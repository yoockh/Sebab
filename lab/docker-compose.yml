# Optional: run the failure lab in a container.
#
#   UID=$(id -u) GID=$(id -g) docker compose -f lab/docker-compose.yml up --build
#
# Run it from the repository root: lab/out/config.toml then refers to the CA by
# its host path ($PWD/lab/out/ca.pem).
#
# The lab binds 127.0.0.1 only, so the container shares the host network
# namespace; nothing is exposed beyond loopback. The generated CA and config
# land in lab/out/ (bind mount).
services:
  sebab-lab:
    build:
      context: ..
      dockerfile: lab/Dockerfile
    network_mode: host
    user: "${UID:-1000}:${GID:-1000}"
    command: ["-ca-ref", "${PWD}/lab/out/ca.pem"]
    volumes:
      - ./out:/lab/out
