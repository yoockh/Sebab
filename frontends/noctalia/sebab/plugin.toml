# Sebab: endpoint monitor that names the failing layer and whose side the fault
# is on. All probing and diagnosis happens in the external `sebab` engine; this
# plugin only displays its JSON event stream and calls its CLI.
#
#   service  "engine"  runs `sebab watch`, publishes state "sebab", shows notifications
#   widget   "status"  aggregate state in the bar (left: panel, right: check now)
#   panel    "panel"   monitor list, details, add/edit/delete/pause, copy diagnosis

id           = "yoockh/sebab"
name         = "Sebab"
version      = "0.2.0"
plugin_api   = 32
author       = "yoockh"
license      = "MIT"
icon         = "heart-rate-monitor"
description  = "Endpoint monitor that names the failing layer (DNS, TCP, TLS, HTTP) and whose side the fault is on."
tags         = ["bar", "panel", "service", "network", "development", "indicator"]
dependencies = ["sebab"]

[[setting]]
key             = "binary"
type            = "string"
label_key       = "settings.binary.label"
description_key = "settings.binary.description"
default         = "sebab"

[[setting]]
key             = "notifications"
type            = "bool"
label_key       = "settings.notifications.label"
description_key = "settings.notifications.description"
default         = true

[[service]]
id    = "engine"
entry = "service.luau"

[[widget]]
id    = "status"
entry = "widget.luau"

  [[widget.setting]]
  key             = "compact"
  type            = "bool"
  label_key       = "settings.compact.label"
  description_key = "settings.compact.description"
  default         = false

[[panel]]
id                       = "panel"
entry                    = "panel.luau"
width                    = 520
height                   = 720
placement                = "attached"
position                 = "auto"
open_near_click          = true
dismiss_on_outside_click = true
